name: Auto-post news

on:
  schedule:
    # Every 15 min at off-peak minutes, 01:07-17:52 UTC = 6:37 AM to 11:22 PM IST.
    # GitHub skips many scheduled runs, so the script paces itself: each run posts only if it is
    # behind the day's plan (30 posts spread 6:30 AM-9 PM IST), up to 3 at once to catch up,
    # and never more than the daily section quotas (30 total).
    - cron: "7,22,37,52 1-17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write articles but do NOT publish"
        type: boolean
        default: true
      posts:
        description: "How many posts to publish right now (ignores the schedule, still respects the daily limit)"
        default: "1"

permissions:
  contents: write # to commit posted.json (the list of stories already covered)

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate and publish articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_URL: ${{ vars.WP_URL || 'https://thenewswala.com' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT }}
          POST_STATUS: ${{ vars.POST_STATUS }}
          TOPIC_QUOTAS: ${{ vars.TOPIC_QUOTAS }}
          ALWAYS_CATEGORY_IDS: ${{ vars.ALWAYS_CATEGORY_IDS }}
          REQUIRE_IMAGE: ${{ vars.REQUIRE_IMAGE }}
          FORCE_POSTS: ${{ inputs.posts }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python autopost.py

      - name: Save list of posted stories
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          if ! git diff --staged --quiet; then
            git commit -m "Update posted stories log"
            git pull --rebase
            git push
          fi
